[package]
name = "migration"
version = "1.0.0"
edition = "2021"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[features]
sqlite = ["sea-orm-migration/sqlx-sqlite"]
postgres = ["sea-orm-migration/sqlx-postgres"]

[dependencies]
async-std = { version = "1", features = ["attributes", "tokio1"] }

[dependencies.sea-orm-migration]
version = "1.1.0"
features = ["sqlx-sqlite", "runtime-actix-rustls"]
