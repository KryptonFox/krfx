[package]
name = "api"
edition = "2021"
publish = false
version = { workspace = true }

[dependencies]
migration = { path = "../migration" }
entity = { path = "../entity" }

dotenvy = "*"
envy = "*"

sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-actix-rustls"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
actix-web = { version = "4", features = ["cookies"] }
actix-multipart = "0.7"
actix-cors = "0.7"
awc = { version = "3.6", features = ["rustls"] }

jsonwebtoken = { version = "9", default-features = false }
k-snowflake = "2.1.1"
chrono = "0.4"
env_logger = "0.11"
fastrand = "2"
url = "2.5"
regex = "1"
once_cell = "1.21"

base64 = "0.22"
sha2 = "0.10"
md5 = "0.7"

aws-config = { version = "1.6", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.83.0"