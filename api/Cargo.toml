[package]
name = "api"
version = "1.0.0"
edition = "2021"

[dependencies]
migration = { path = "../migration" }
entity = { path = "../entity" }

dotenvy = "*"
envy = "*"

sea-orm = { version = "1.1.0", features = ["sqlx-sqlite", "runtime-actix-rustls"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
actix-web = { version = "4", features = ["cookies"] }
actix-multipart = "0.7"
actix-cors = "0.7"
awc = { version = "3.5.1", features = ["rustls"] }

jsonwebtoken = { version = "9", default-features = false }
k-snowflake = "1.1.0"
chrono = "0.4"
env_logger = "0.11.6"
fastrand = "2"
url = "2.5"
regex = "1"
once_cell = "1.20"

base64 = "0.22"
sha2 = "0.10"
md5 = "0.7"

aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.74.0"